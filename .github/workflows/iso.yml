name: Build ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      include_ollama:
        description: "Bundle Ollama in the ISO (adds ~5 GB)"
        type: boolean
        default: false
  # Build-only gate on PRs that touch the ISO recipe / units / wizard, so a
  # build break is caught at review time instead of at the next tag. Signing
  # + release are skipped on PRs (see the if: guards below).
  pull_request:
    paths:
      - "iso/**"
      - "systemd/**"
      - "src/anglerfish/wizard/**"
      - "pyproject.toml"
      - ".github/workflows/iso.yml"

# Least-privilege default at the workflow level; the build job elevates
# only the two permissions it actually needs (release upload + cosign OIDC).
permissions:
  contents: read

jobs:
  build:
    name: live-build ISO (containerised)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # for Release uploads
      id-token: write   # for cosign keyless signing
    steps:
      - uses: actions/checkout@v6

      # The build runs entirely inside the pinned Debian bookworm container
      # (iso/Dockerfile) via ./build.sh - the exact same path used in WSL
      # and on a fresh VM. The runner's own live-build is never used, so the
      # Ubuntu-fork option-rejection problem cannot recur. ./build.sh leaves
      # the ISO + checksum in ./output/.
      - name: Build ISO (Debian bookworm container)
        run: |
          ./build.sh ${{ inputs.include_ollama && '--with-ollama' || '--without-ollama' }}

      - name: Compute provenance metadata
        id: meta
        run: |
          iso=$(ls output/anglerfish-ai-*.iso | head -1)
          echo "iso=$iso" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$iso" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$iso" | sed -E 's|.*anglerfish-ai-(.*)\.iso|\1|')" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign on the runner, not in the container: cosign keyless needs the
      # runner-scoped GitHub OIDC token. Signature -> .sig, certificate ->
      # .pem (consistent with iso/build.sh --sign and the README verify
      # instructions).
      - name: Sign ISO (keyless OIDC)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign-blob --yes \
            --output-signature "${{ steps.meta.outputs.iso }}.sig" \
            --output-certificate "${{ steps.meta.outputs.iso }}.pem" \
            "${{ steps.meta.outputs.iso }}"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: anglerfish-ai-${{ steps.meta.outputs.version }}
          path: |
            output/anglerfish-ai-*.iso
            output/anglerfish-ai-*.iso.sha256
            output/anglerfish-ai-*.iso.sig
            output/anglerfish-ai-*.iso.pem
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          generate_release_notes: true
          files: |
            output/anglerfish-ai-*.iso
            output/anglerfish-ai-*.iso.sha256
            output/anglerfish-ai-*.iso.sig
            output/anglerfish-ai-*.iso.pem
