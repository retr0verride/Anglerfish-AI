# Anglerfish-AI operator sshd hardening.
#
# This is the REAL OpenSSH server the operator uses on the service NIC (the
# wizard opens tcp/22 there). It is NOT the lure: the honeypot's fake SSH is
# a separate asyncssh listener on the bait NIC.
#
# The operator authenticates as the dedicated anglerfish-ops account with
# the key the wizard installs, so force key-based auth. With password +
# keyboard-interactive auth disabled, a key-less root login is impossible
# regardless of PermitRootLogin.
#
# Operators who confirm the anglerfish-ops account is the only login path
# may tighten PermitRootLogin to `no`.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password

# A management endpoint has no use for forwarding or X11.
AllowTcpForwarding no
X11Forwarding no
